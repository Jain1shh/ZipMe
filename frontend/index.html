<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZipMe - URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <span class="text-warning">Zip</span>Me
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#" onclick="showSection('zipFormSection'); return false;">Generate Short URL</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showSection('infoSection'); return false;">URL Info/Stats</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div id="zipFormSection">
            <h1 class="mb-4">🔗 Generate a Short URL</h1>
            <div class="card shadow-sm p-4">
                <form id="zipmeForm">
                    <div class="mb-3">
                        <label for="longUrlInput" class="form-label">Long URL</label>
                        <input type="url" class="form-control" id="longUrlInput" placeholder="e.g., https://very-long-website-address.com/..." required>
                    </div>
                    <div class="mb-3">
                        <label for="aliasInput" class="form-label">Custom Alias (Optional)</label>
                        <input type="text" class="form-control" id="aliasInput" placeholder="e.g., my-favorite-link">
                        <div class="form-text">If not provided, a random code will be generated (Base62).</div>
                    </div>
                    <button type="submit" class="btn btn-warning btn-lg w-100">Zip It!</button>
                </form>
            </div>

            <div id="outputArea" class="mt-4" style="display:none;">
                <div class="alert alert-success d-flex align-items-center" role="alert" id="successAlert">
                    <div id="resultMessage"></div>
                    <button type="button" class="btn btn-sm btn-outline-success ms-3" id="copyButton">Copy</button>
                </div>
            </div>

            <div id="errorArea" class="mt-4" style="display:none;">
                <div class="alert alert-danger" role="alert" id="errorAlert">
                    <div id="errorMessage"></div>
                </div>
            </div>
        </div>

        <div id="infoSection" style="display:none;">
            <h1 class="mb-4">📊 URL Information & Stats</h1>
            <div class="card shadow-sm p-4">
                <form id="infoForm">
                    <div class="mb-3">
                        <label for="codeInput" class="form-label">Short Code or Alias</label>
                        <input type="text" class="form-control" id="codeInput" placeholder="e.g., aBcXyZ or my-favorite-link" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Get Info</button>
                </form>
            </div>

            <div id="infoOutputArea" class="mt-4" style="display:none;">
                <div class="card p-3 bg-light">
                    <h5>Details for Code: <span id="infoCodeDisplay"></span></h5>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item"><strong>Original URL:</strong> <span id="infoLongUrl"></span></li>
                        <li class="list-group-item"><strong>Short URL:</strong> <span id="infoShortUrl"></span></li>
                        <li class="list-group-item"><strong>Click Count:</strong> <span id="infoClicks"></span></li>
                    </ul>
                </div>
            </div>
            <div id="infoErrorArea" class="mt-4" style="display:none;">
                <div class="alert alert-warning" role="alert">
                    <div id="infoErrorMessage"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
